<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Seller Registration</h1>
        
        <form method="POST" action="{% url 'seller_register' %}" class="space-y-6">
            {% csrf_token %}
            
            <!-- Account Info -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 mb-3">Account Info</h2>
                
                <div class="mb-4">
                    <label class="block text-gray-600 mb-1" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-600 mb-1" for="id_email">Email</label>
                    <input type="email" name="email" id="id_email" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-600 mb-1" for="id_password1">Password</label>
                    <input type="password" name="password1" id="id_password1" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    <p class="text-sm text-gray-500 mt-1">
                        Must be at least 8 characters, not too common, and not entirely numeric.
                    </p>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-600 mb-1" for="id_password2">Confirm Password</label>
                    <input type="password" name="password2" id="id_password2" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
            </div>

            <!-- Seller Info -->
            <div>
                <h2 class="text-xl font-semibold text-gray-700 mb-3">Seller Info</h2>

                <div class="mb-4">
                    <label class="block text-gray-600 mb-1" for="id_name">Name</label>
                    <input type="text" name="name" id="id_name" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-600 mb-1" for="id_address">Address</label>
                    <textarea name="address" id="id_address" rows="3" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Register</button>
        </form>
    </div>

</body>
</html>
