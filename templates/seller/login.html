<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-lg rounded-2xl p-8 w-full max-w-lg">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Seller Login</h1>
        
        <!-- Messages -->


        <!-- Login Form -->
        <form method="POST" action="{% url 'seller_login' %}" class="space-y-6">
            {% csrf_token %}

            <div class="mb-4">
                <label class="block text-gray-600 mb-1" for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <div class="mb-4">
                <label class="block text-gray-600 mb-1" for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">Login</button>
        </form>

        <div class="mt-4 text-center">
            <a href="{% url 'seller_register' %}" class="text-blue-600 hover:underline">Don't have an account? Register</a>
        </div>

        <div class="mt-2 text-center">
            <a href="#" class="text-gray-500 hover:underline text-sm">Forgot Password?</a>
        </div>

    </div>

</body>
</html>
