<!-- seller/templates/seller/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seller Panel{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-white shadow-lg transform -translate-x-full transition-transform duration-300 z-50">
        <div class="p-6">
            <h2 class="text-2xl font-bold mb-6">Seller Menu</h2>
            <ul class="space-y-4">
                <li><a href="{% url 'seller_dashboard' %}" class="block text-gray-700 hover:bg-blue-100 px-4 py-2 rounded-lg">Dashboard</a></li>
                <li><a href="{% url 'products' %}" class="block text-gray-700 hover:bg-blue-100 px-4 py-2 rounded-lg">View Products</a></li>
                 <li><a href="{% url 'view_orders' %}" class="block text-gray-700 hover:bg-blue-100 px-4 py-2 rounded-lg">Manage Orders</a></li>
                <li><a href="{% url 'seller_logout' %}" class="block text-gray-700 hover:bg-red-100 px-4 py-2 rounded-lg">Logout</a></li>
            </ul>
        </div>
    </div>

    <!-- Overlay for sidebar toggle -->
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-30 hidden z-40" onclick="toggleSidebar()"></div>

    <!-- Header -->
    <header class="bg-white shadow p-4 flex items-center justify-between">
        <button onclick="toggleSidebar()" class="text-gray-700 focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
        <h1 class="text-xl font-bold">{% block page_title %}Seller Panel{% endblock %}</h1>
    </header>

    <!-- Main content -->
    <main class="flex-1 p-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white shadow p-4 text-center text-gray-600">
        &copy; {% now "Y" %} PrimeMart. All rights reserved.
    </footer>

    <!-- Sidebar toggle script -->
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }
    </script>

</body>
</html>
