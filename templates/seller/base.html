{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Prime Mart{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Correct way to include CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <div class="app">
        {% include 'seller/sidebar.html' %}
        
        <main id="main" class="main">
            {% include 'seller/header.html' %}
            
            {% block content %}
            <!-- Main content goes here -->
            {% endblock %}
        </main>
    </div>

    <!-- Hamburger -->
    <div id="hamb" class="hamburger">☰</div>

    <!-- Profile -->
    {% include 'seller/profile.html' %}

    <!-- Correct way to include JS -->
    <script src="{% static 'js/script.js' %}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
